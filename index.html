<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App-Films</title>
  </head>
  <body >   
      <div class="wrapper">     
          <header class=" min-w-0  flex justify-between items-center cursor-pointer">
              <div class="logo flex flex-col justify-center items-center  w-25 550px:w-50 ">
                  <span class="text-xs 550px:text-xl font-bold  text-white">MEGA ACTION</span>
                  <span class="text-xs  text-white">FILMS</span>
              </div>
              <ul class="hidden 1050px:flex  justify-between text-md  min-w-0  w-120 1500px:w-200 text-white ">
                <li>ТЕЛЕКАНАЛИ</li>
                <li>ФІЛЬМИ</li>
                <li>МУЛЬТФІЛЬМИ</li>
                <li class="serial1">СЕРІАЛИ</li>
                <li>ШОУ</li>
              </ul>
              <div class="search flex items-center gap-1 justify-center   ">
                    <input class="rounded-xl bg-white" id="search" type="text" placeholder="Назва фільму"> 
                    <i id="lupa" class="fa-solid fa-magnifying-glass fa-flip-360"></i>
                    <button class="text-md font-bold rounded-xl text-white" id="btn">Поиск</button>
                    <div class="menu text-xl  text-white p-5"><i class="fa-solid fa-bars-staggered"></i></div>
                </div>             
          </header>  
                                  <!--Бургер меню--> 
                    <div class="movie-sidebar text-white">
                        <h2 class="text-center font-bold text-3xl">Filter</h2>
                        <ul class="flex-col text-2xl">
                            <li id="main">Главная</li>  
                            <li class="serial">Серіали<i id="arrow" class="fa-solid fa-chevron-right"></i> 
                              <ul id="list-open" class="overflow-hidden opacity-0 ">
                                  <li id="action">Action</li>
                                  <li id="comedy">Comedy</li>
                                  <li id="horror">Horror</li>
                                  <li id="thriller">Thriller</li>
                              </ul>
                            </li>                     
                        </ul>
                        <div class="close text-white"><i class="fa-solid fa-xmark"></i></div>
                    </div>                      
          <main class="w-full">                       
                <div class="block-film  gap-1 flex flex-col justify-center items-center p-5 w-100%">   
                  <h1 class="text-white text-2xl 550px:text-4xl font-bold  text-center w-80 550px:w-150  mb-3 ">Фільми та серіали від Action-Films </h1>
                
                  <div class="flex wrap-slide   object-contain overflow-hidden bg-white  rounded-xl ">
                      <div class="overdisplayL"></div>
                      <div class="overdisplayR"></div>
                         <div class="  flex  w-[1800px]  gap-3 p-2 object-contain " id="image-1">                    
                            <img id="image-x" class="slide-img shrink-0 w-[600px] h-auto  object-contain rounded-2xl  " src="./public/img/image-4.jpg" alt="" > 
                            <img id="image-y" class="slide-img shrink-0 w-[600px] h-auto object-contain rounded-2xl " src="./public/img/image-4.jpg" alt="" > 
                            <img id="image-z" class="slide-img shrink-0 w-[600px] h-auto object-contain rounded-2xl" src="./public/img/image-4.jpg" alt="" > 
                            <img id="image-a" class="slide-img shrink-0 w-[600px] h-auto  object-contain rounded-2xl " src="./public/img/image-4.jpg" alt="" > 
                            <img id="image-b" class="slide-img shrink-0 w-[600px] h-auto object-contain rounded-2xl" src="./public/img/image-4.jpg" alt="" > 
                            <img id="image-c" class="slide-img shrink-0 w-[600px] h-auto object-contain rounded-2xl" src="./public/img/image-4.jpg" alt="" > 
                             
                        </div> 
                  </div>                    
                                                                         
                      <div id="movies" class="flex justify-center items-center flex-nowrap gap-10  object-contain overflow-y-hidden w-[90] mx-auto">                         
                      </div>
                </div>
          </main>
          <footer>
                <form id="form-comments" class=" flex flex-col gap-3 p-2">
                  <h3 class="text-2xl font-bold">Comments(<span id="counter">0</span>)</h3>
                  <input type="text" name="user.name" placeholder="Enter your name">
                  <input type="text" name="comment" placeholder="Write comment... ">
                  <button type="submit">Send</button>
                </form>
                <div class="show-comments">           
                </div>
          </footer>

      </div> 
          

      
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
