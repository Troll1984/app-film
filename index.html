<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app-films</title>
  </head>
  <body >   
    <div class="wrapper">     
        <header class=" min-w-0  flex justify-between items-center cursor-pointer">
             <div class="logo flex flex-col justify-center items-center text-black   w-50 ">
                <span class="text-xl font-bold ">MEGA ACTION</span>
                <span class="text-xs">FILMS</span>
             </div>
             <ul class="hidden 1050px:flex  justify-between text-md  min-w-0  w-120 1500px:w-200 ">
              <li>ТЕЛЕКАНАЛИ</li>
              <li>ФІЛЬМИ</li>
              <li>МУЛЬТФІЛЬМИ</li>
              <li>СЕРІАЛИ</li>
              <li>ШОУ</li>
            </ul>
             <div class="search flex items-center gap-1 justify-center p-15 1200px:pr-5 ">
                  <!--<input class="rounded-xl bg-white" id="search" type="text" placeholder="Назва фільму"> -->
                  <i  class="fa-solid fa-magnifying-glass fa-flip-360"></i>
                  <button class="text-md font-bold rounded-xl text-white" id="btn">Поиск</button>
              </div>
             <div class="hidden menu text-3xl w-25"><i class="fa-solid fa-bars-staggered"></i></div>
             
        </header>   
        <div class="movie-sidebar">
                        <h2 class="text-center font-bold text-3xl">Filter</h2>
                        <ul class="flex-col text-2xl">
                            <li id="main">Главная</li>  
                            <li id="serial">Серіали<i id="arrow" class="fa-solid fa-chevron-right"></i> 
                              <ul id="list-open">
                                  <li id="action">Action</li>
                                  <li id="comedy">Comedy</li>
                                  <li id="horror">Horror</li>
                                  <li id="thriller">Thriller</li>
                              </ul>
                            </li>                     
                        </ul>
                    </div>                      
          <main>                       
              <div class="block-film flex-col gap-1  ">                     
                    <div class="block-image">
                      <div class="title">
                         <h3>Найновіщі фільми та серіали</h3>                         
                          <img src="./public/img/images.jfif" alt="">
                      </div>
                     
                      <img id="image" src="./public/img/image-10.png" alt="Film">
                    </div>         
                    <div class="flex flex-wrap gap-10 " id="movies">
                    </div>
              </div>
          </main>
           <footer>
      <form id="form-comments">
        <h3>Comments(<span id="counter">0</span>)</h3>
        <input type="text" name="user.name" placeholder="Enter your name">
        <input type="text" name="comment" placeholder="Write comment... ">
        <button type="submit">Send</button>
      </form>
      <div class="show-comments">
           
      </div>
     </footer>

          </div> 
          

      
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
