<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app-film</title>
  </head>
  <body >   
    <div class="wrapper">     
          <header>
              <h1 class="text-3xl 450px:text-5xl 550px:text-7xl text-white font-bold ">Mega Film Action Serials</h1>
              <p class="text-2xl 450px:text-2xl 550px:text-4xl text-white font-bold">Серіали для родини</p>
          </header>                 
          <main>
              <div class="search flex items-center gap-1 justify-center ">
                  <input class="rounded-xl bg-white" id="search" type="text" placeholder="Введите название фильма">
                  <button class="text-md font-bold rounded-xl text-white" id="btn">Поиск</button>
              </div>
                     
              <div class="block-film flex gap-1 items-center justify-center ">   
                   <div class="movie-sidebar">
                        <h2 class="text-center font-bold text-3xl">Filter</h2>
                        <ul class="text-2xl flex 1050px:block">
                            <li id="main">Главная</li>  
                            <li id="serial">Серіали<i id="arrow" class="fa-solid fa-chevron-right"></i> 
                              <ul id="list-open">
                                  <li id="action">Action</li>
                                  <li id="comedy">Comedy</li>
                                  <li id="horror">Horror</li>
                                  <li id="thriller">Thriller</li>
                              </ul>
                            </li>                     
                        </ul>
                    </div> 
                
                  <img id="image" src="./public/img/image-10.png" alt="Film">
                    
                
              
                    <div class="flex flex-wrap gap-10 " id="movies">

                    </div>
                    

              </div>
          </main>
           <footer>
      <form id="form-comments">
        <h3>Comments(<span id="counter">0</span>)</h3>
        <input type="text" name="user.name" placeholder="Enter your name">
        <input type="text" name="comment" placeholder="Write comment... ">
        <button type="submit">Send</button>
      </form>
      <div class="show-comments">
           
      </div>
     </footer>

          </div> 
          

      
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
